<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha — PIXELPRESS</title>
  <link rel="icon" href="assets/pixelpress-icon.png">
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body class="__variable_231f96 __variable_532bb9 __variable_4dc837 font-sans">
<div class="auth-bg min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
  <div class="absolute top-1/4 left-1/4 w-96 h-96 rounded-full blur-3xl" style="background:rgba(245,180,0,.18)"></div>
  <div class="absolute bottom-1/4 right-1/4 w-72 h-72 rounded-full blur-3xl" style="background:rgba(255,198,26,.16)"></div>

  <div class="relative z-10 w-full max-w-md space-y-6">
    <div class="flex justify-center">
      <a href="index.html" class="flex items-center gap-2.5">
        <img src="assets/pixelpress-icon.png" alt="PixelPress" width="48" height="48" class="rounded-lg object-contain" style="width:48px;height:48px">
        <span class="font-display font-extrabold tracking-tight text-gray-900 text-2xl">PIXELPRESS</span>
      </a>
    </div>

    <div class="card" style="box-shadow:0 20px 45px rgba(76,29,149,.12)">
      <div class="flex flex-col space-y-1.5 p-6 text-center pb-2">
        <h3 class="font-semibold font-display text-2xl tracking-tight">Esqueceu sua senha?</h3>
        <p class="text-sm text-muted-foreground">Informe seu email para receber o link de recuperação.</p>
      </div>
      <div class="p-6 pt-0">
        <form class="space-y-4" id="fpForm">
          <div class="space-y-2">
            <label class="label" for="email">Email da sua conta</label>
            <div class="relative">
              <span id="icoMail" style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:#9ca3af;display:flex"></span>
              <input class="input pl-10" id="email" type="email" required placeholder="voce@email.com">
            </div>
          </div>
          <button class="btn btn-primary w-full" type="submit" id="submitBtn" disabled><span id="icoMailBtn"></span> Enviar link de recuperação</button>
        </form>
        <div class="text-center" style="margin-top:1rem">
          <a class="inline-flex items-center gap-1 text-sm text-muted-foreground hover:text-primary" href="login.html" id="backLink"><span id="icoBack"></span> Voltar para o login</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  document.getElementById("icoMail").innerHTML = UI.icon("mail", "h-4 w-4");
  document.getElementById("icoBack").innerHTML = UI.icon("arrowLeft", "h-3.5 w-3.5");
  document.getElementById("icoMailBtn").outerHTML = UI.icon("mail", "h-4 w-4");

  const email = document.getElementById("email");
  const btn = document.getElementById("submitBtn");
  email.addEventListener("input", () => { btn.disabled = !/^\S+@\S+\.\S+$/.test(email.value.trim()); });

  document.getElementById("fpForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Enviando...";
    await new Promise((r) => setTimeout(r, 700));
    UI.toast.success("Se este email existir, enviamos um link de recuperação.");
    btn.textContent = "Link enviado ✓";
    setTimeout(() => { location.href = "login.html"; }, 1600);
  });
})();
</script>
</body>
</html>
